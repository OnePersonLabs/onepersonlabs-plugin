interface:
  display_name: "Rolling Wave Workflow"
  short_description: "Plan phases and report what works and what remains"
  default_prompt: "Use $onepersonlabs:rolling-wave-workflow to plot in actual Plan Mode, execute one agreed phase with applicable step skills, and return with a checkpoint report in $onepersonlabs:write's concise-report mode and a branching chart. Compose with Conductor when available and configured; retain each workflow's ownership."

policy:
  allow_implicit_invocation: true
